<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BharatVerse Redirect</title>
    <script>
      var path = window.location.pathname;
      var clean = path.replace(/^\/BharatVerse\/?/, '');
      var target = '/BharatVerse/#' + (clean.startsWith('/') ? clean : '/' + clean) + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
    Redirecting to BharatVerse...
  </body>
</html>
